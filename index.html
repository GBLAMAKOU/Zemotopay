<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZemotoPay Benin</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f7faf8}.hero{background:#0f8a7a;color:#fff;padding:28px 18px;text-align:center;border-radius:0 0 24px 24px}.card{background:#fff;margin:10px;border-radius:14px;padding:12px;display:flex;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.06)}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;margin-top:6px}.b-p{background:#dcfce7;color:#065f46;padding:6px 10px;border-radius:8px}.b-n{background:#fee2e2;color:#991b1b;padding:6px 10px;border-radius:8px}input{width:100%;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:9px}.top{background:#0f8a7a;color:#fff;padding:12px;display:flex;justify-content:space-between}</style></head><body><div id="app"></div><script>
let s=JSON.parse(localStorage.getItem('zp'))||{user:null,motos:[{immat:"AA 2345 BJ",driver:"Ibrahim",paye:true},{immat:"AB 7812 BJ",driver:"Koffi",paye:false}]};
function save(){localStorage.setItem('zp',JSON.stringify(s))}
function home(){return `<div class=hero><h1>ZémotoPay 🇧🇯</h1><p>Ne perdez plus 30 000F / mois<br>Gérez vos zems sur WhatsApp</p><div style="background:#fff;color:#0f8a7a;display:inline-block;padding:6px 14px;border-radius:20px;font-weight:800">2500F / mois - 7 jours gratuit</div><br><br><button class=btn style="background:white;color:#0f8a7a" onclick="signup()">COMMENCER MAINTENANT</button></div><div style="padding:14px"><h3>Comment ça marche?</h3><p>✅ 1. Ajoutez vos motos<br>✅ 2. Cochez Payé / Non payé<br>✅ 3. Alerte WhatsApp auto</p></div>`}
function dash(){let tot=s.motos.filter(m=>m.paye).length*4000;let h=`<div class=top><b>ZémotoPay</b><small>${s.user} - ${s.motos.length} motos</small></div><div style="margin:10px;background:#dcfce7;border-radius:12px;padding:12px">Recette du jour: <b>${tot} F</b></div>`;s.motos.forEach((m,i)=>{h+=`<div class=card><div><b>${m.immat}</b><br><small>${m.driver}</small></div><div class="${m.paye?'b-p':'b-n'}" onclick="tog(${i})">${m.paye?'Payé':'Non payé'}</div></div>`});h+=`<div style="padding:10px"><input id=im placeholder="Immat AA 1234 BJ"><input id=dr placeholder="Nom conducteur"><button class=btn style="background:#0f8a7a;color:white" onclick="add()">Ajouter moto</button><button class=btn style="background:#22c55e;color:white" onclick="wa()">Alerter WhatsApp Non-Payés</button><button class=btn style="background:#eee" onclick="s.user=null;save();render()">Déconnexion</button><p style="text-align:center;font-size:12px;margin-top:12px">Lien à envoyer aux clients: <b>zemotopay.com</b><br>Essai gratuit - Payer via FedaPay 2500F</p></div>`;return h}
function signup(){let n=prompt("Votre nom:");if(!n)return;s.user=n;save();render()}
function add(){let im=document.getElementById('im').value,dr=document.getElementById('dr').value;if(!im||!dr)return alert('Remplis immat et nom');s.motos.push({immat:im,driver:dr,paye:false});save();render()}
function tog(i){s.motos[i].paye=!s.motos[i].paye;save();render()}
function wa(){let non=s.motos.filter(m=>!m.paye).map(m=>m.immat).join(', ');if(!non)return alert('Tout est payé!');let txt=`Rappel ZémotoPay: ${non} - Merci de payer aujourd'hui`;window.open('https://wa.me/?text='+encodeURIComponent(txt))}
function render(){document.getElementById('app').innerHTML=s.user?dash():home()}render();
</script></body></html>
